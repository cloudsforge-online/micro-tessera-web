# The SPA's server block.
#
# THE ONE THING TO UNDERSTAND HERE: an unknown path answers 404, not 200.
#
# The usual SPA fallback is `try_files $uri /index.html`, which serves the bundle with a 200 for
# every address in existence: search engines index the error screen, uptime checks call it healthy,
# and a deploy that drops a route looks exactly like a deploy that did not. So the client routes
# are ENUMERATED below, and everything else falls through to `error_page 404 /index.html`, which
# serves the same bundle while KEEPING the 404 status. React renders NotFoundPage inside it, and
# the status line tells the truth.
#
# The cost is that this list and the route table in src/lib/routes.ts must agree. That is one line
# per top-level route, paid once per route, in exchange for an honest status code on every wrong
# URL. test/routes.test.ts holds the two together.

# ── IS THIS HOSTNAME AN ENVIRONMENT OTHER THAN MAINNET? ────────────────────────────────────────
#
# `map` is in http context, which is why it sits above the server block rather than inside it — a
# conf.d file is included in http, so this is legal here and would not be legal fifteen lines down.
#
# THE LABELS ARE `ENV_LABELS` FROM @cloudsforge/ui/surfaces, and test/sitemap.test.ts reads that
# export and fails if this alternation has drifted from it. They are the words that name an
# ENVIRONMENT rather than a surface: `surfaces.ts` reserves them so no surface may take one as a
# subdomain, and `deploy/scripts/check-apex-prefix.py` enforces that.
#
# A testnet estate carries test EMBER, a faucet, and wards full of objects fired for the purpose of
# breaking something. Every page of it competing with the real world in a search index is a support
# problem before it is an SEO one — a stranger who lands on a testnet parcel is looking at a place
# that will be wiped, with a Kiln that charges nothing and a workshop that pays nothing. So a
# non-mainnet environment answers `Disallow: /` and serves no sitemap.
#
# `(?:[^.]+-)?` catches BOTH shapes. The environment is a suffix on the first label now
# (`tessera-testnet.<apex>`) and was an apex prefix before (`testnet.<apex>`, which put this surface
# at the two-label `tessera.testnet.<apex>` — unreachable, because Cloudflare's Universal SSL is a
# one-label wildcard and every two-label name fails the handshake at the edge). `surfaces.ts` keeps
# the old shape deliberately, so both have to match or half the estate stays indexable on testnet.
map $host $cf_env {
    default '';
    ~^(?:[^.]+-)?(?:testnet|staging|preview|dev|mainnet)\. 'yes';
}

server {
    # 8080 because the image is nginx-unprivileged: nothing in this container is root, and a
    # non-root process cannot bind 80.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing is real routing: the address must survive a hard refresh.
    absolute_redirect off;

    # A ward's sprites are hundreds of 512x512 PNGs. The default 1m body/proxy buffers are for
    # requests; this is about responses, and the default is fine — but the connection count is
    # not, so keepalive is raised well above nginx's default 100 requests per connection. Without
    # it a single parcel's load renegotiates TLS four times mid-render.
    keepalive_requests 1000;

    # ---- security headers ------------------------------------------------
    # ─────────────────────────────────────────────────────────────────────────────────────────────
    # THESE ARE REPEATED IN EVERY `location` BELOW THAT SETS ANY HEADER OF ITS OWN, AND THAT IS NOT
    # REDUNDANCY. nginx's `add_header` inheritance is ALL OR NOTHING PER LEVEL: a location
    # containing even one `add_header` discards every `add_header` from the enclosing block, so a
    # location that adds a Cache-Control silently drops all three of these. The web template's own
    # config has exactly this bug and serves every hashed asset with no nosniff header — measured
    # against a running image, not reasoned about.
    # ─────────────────────────────────────────────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- assets ----------------------------------------------------------
    # Immutable, because every build emits new hashed filenames. A missing asset is a 404 on its
    # own terms and must NOT fall through to the app shell: a JavaScript request answered with HTML
    # fails with a syntax error that names the wrong file.
    location /worlds/tessera/assets/ {
        try_files $uri =404;
        # Repeated, not inherited. See the note at the server level.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---- the world's sprites ---------------------------------------------
    # `/world-assets/` is what src/lib/hosts.ts asks for, and it is SAME-ORIGIN on purpose: a ward
    # costs several hundred image requests, and a cross-origin path would put a CORS preflight in
    # front of every one of them.
    #
    # It is NOT served from this image. micro-deploy maps it at the gateway to wherever
    # micro-tessera-assets is materialised, so the bundle and the art can be promoted separately —
    # and so 784 PNGs are not baked into a static image that has to be rebuilt to change one chair.
    # Until that mapping exists this location 404s, which is the correct answer: the client reports
    # a missing sprite by name and substitutes nothing.
    #
    # NO try_files FALLBACK HERE EITHER. A sprite request answered with index.html decodes as a
    # corrupt PNG rather than as a 404, and the client would report a decode failure for a file
    # that simply is not there.
    #
    # ── THE URL MOVED WITH THE BUNDLE; THE STORAGE DID NOT ────────────────────────────────────
    #
    # Since wave 3f this client is `<apex>/worlds/tessera`, and `/world-assets/` at the APEX root
    # is micro-site's address — a request there never reaches this container, so every sprite in
    # the game would 404 with the client naming each missing file by name. The URL therefore has
    # to carry the mount, and `assetBase()` in src/lib/hosts.ts composes it.
    #
    # `alias` rather than a matching move of the volume: the PVC mounts at
    # `/usr/share/nginx/html/world-assets` and the pre-flight job that refuses a half-populated
    # set counts PNGs at `/world-assets`. Both are about WHERE THE BYTES ARE, and neither has any
    # reason to change because the address in front of them did. One line here keeps the 784
    # content-addressed files exactly where every other part of the estate expects them.
    location /worlds/tessera/world-assets/ {
        alias /usr/share/nginx/html/world-assets/;
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Content-addressed bytes under a stable path. A sprite that changes gets a new path,
        # because materialise.py writes by identity — so a long cache is safe and a short one is
        # several hundred revalidations per parcel.
        add_header Cache-Control "public, max-age=604800" always;
    }

    # index.html is never cached. It is the file that names the current asset hashes, so a stale
    # copy pins a browser to a deploy that no longer exists.
    #
    # THE HEADER HAS TO BE REPEATED ON EVERY LOCATION THAT SERVES IT: `location = /index.html` only
    # matches a request for that literal path, while `location = /` and the enumerated route block
    # below serve the same file through `try_files` WITHOUT re-entering this block.
    location = /worlds/tessera/index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---- the client routes, enumerated -----------------------------------
    # Keep in step with ROUTES in src/lib/routes.ts, which is also what the router and the
    # navigation are built from. test/routes.test.ts checks all three against each other, because a
    # route added to the router and not here works perfectly under `pnpm dev` and 404s on the first
    # hard refresh in production — a failure nothing about the diff looks like.
    # BOTH SPELLINGS. `/worlds/tessera/` is an address this surface did not used to have: the 301
    # from the retired hostname lands on it, and so does any link carrying a trailing slash.
    location = /worlds/tessera/ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /worlds/tessera/index.html =404;
    }

    location = /worlds/tessera {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /worlds/tessera/index.html =404;
    }

    # `/?$`, NOT `(/|$)`. The second is a PREFIX, and it served the shell with a 200 for every
    # address beneath an owned route while React rendered the not-found page inside it — the same
    # defect was in micro-web-template and every frontend cut from it, and `site` records finding
    # it a third time in /products/pay.
    #
    # No route in this client takes a path parameter. A parcel is opened by a QUERY STRING —
    # `/?parcel=<uuid>` — deliberately, so that a link to somebody's place is a link to the world
    # view with a place in it rather than a second address for the same screen.
    location ~ ^/worlds/tessera/(wards|land|kiln|discover|workshop)/?$ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /worlds/tessera/index.html =404;
    }

    # ---- the sitemap and robots.txt, emitted with $host -------------------
    # THEY ARE HERE RATHER THAN IN public/ FOR THE ONE REASON THAT DECIDES IT: a sitemap must carry
    # ABSOLUTE URLs — the spec requires it and a crawler discards a relative `<loc>` — and nothing
    # built in this repository is allowed to name a hostname, because one image is served from
    # localhost, from a preview deployment and from the apex (test/no-build-time-config.test.ts).
    # nginx is the component that knows: it has `$host` on every request, so the addresses are
    # composed per request and the artefact stays environment-free.
    #
    # A FILE IN public/ WOULD BE WORSE THAN NOT HAVING ONE. An exact-match location wins over the
    # `location /` prefix that serves the static tree, so a `public/robots.txt` would be built,
    # shipped, unreachable, and edited by the next reader to no effect at all. test/sitemap.test.ts
    # asserts neither file exists.
    #
    # ── WHY THIS IS NOT `sitemapXml()` FROM @cloudsforge/ui ──────────────────────────────────
    #
    # THIS SURFACE IS NOT THE APEX. The shared generator composes every sibling as
    # `<subdomain>.$host`, which is exactly right on the marketing site, where `$host` IS the apex.
    # Here `$host` is already `tessera.<apex>`, so the same generator would emit
    # `worlds.tessera.<apex>` — a two-label hostname that resolves to nothing and fails the edge's
    # one-label wildcard certificate. A sitemap of addresses that cannot be connected to is worse
    # than no sitemap: a crawler handed dead URLs by a site's own index discounts the ones that
    # work.
    #
    # So this surface lists ITS OWN public routes and nothing else, and the estate sitemap stays
    # the apex's job. `robots.txt` has no such problem and IS generated from the design system —
    # test/sitemap.test.ts compares it byte for byte with `robotsTxt()`.
    #
    # THE THREE GATED ROUTES ARE DELIBERATELY ABSENT. `/land`, `/kiln` and `/workshop` are behind
    # ProtectedRoute; a crawler arriving at one is shown a sign-in invitation rather than the page.
    # They are still SERVED by the enumerated block above, because a signed-in player must be able
    # to hard-refresh them — being served and being advertised are different questions, and
    # `SITEMAP_PATHS` in src/lib/routes.ts is the second one.
    #
    # AND THERE IS NO UNBOUNDED FAMILY TO LEAVE OUT. No route in this client takes a path
    # parameter: a parcel is opened by a QUERY STRING, `/?parcel=<uuid>`, so one place is a link to
    # the world view with a place in it rather than a second address for the same screen. That is
    # why this list is the whole public surface rather than a selection from it.
    location = /worlds/tessera/sitemap.xml {
        # `types { }` empties the mime table FOR THIS LOCATION so `default_type` is what applies.
        # Without it nginx maps the `.xml` in the URI to `text/xml` from its own table and the
        # `default_type` line is inert — a declaration that reads as a decision and is not one.
        types { }
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
        # Repeated, not inherited. See the note at the server level: a location declaring any
        # add_header inherits NONE, and this block declares Cache-Control.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # An environment that must not be indexed has no sitemap. `return` inside `if` is one of
        # the two uses of `if` in a location that are defined behaviour rather than a trap.
        if ($cf_env) { return 404; }
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url><loc>$scheme://$host/worlds/tessera</loc></url>
  <url><loc>$scheme://$host/worlds/tessera/wards</loc></url>
  <url><loc>$scheme://$host/worlds/tessera/discover</loc></url>
</urlset>';
    }

    # ---- THERE WAS A `location = /robots.txt` HERE, AND THE FOLDER MOVED IT ------------------
    #
    # A crawler reads robots.txt at the ORIGIN ROOT and nowhere else, so `<apex>/worlds/tessera/robots.txt`
    # is a file nothing ever fetches — a block here could only be dead configuration that READS
    # like a policy.
    #
    # Nothing to carry: this surface disallowed nothing. Its routes are public and there is no
    # client-side search minting an address per `?q=`. The `Sitemap:` line moved to micro-site,
    # which serves the one robots.txt this origin has, and the `if ($cf_env)` refusal moved with it
    # — micro-site already had an identical one, so a testnet apex answers `Disallow: /` and covers
    # this surface by construction rather than by a second copy living where nothing reads it.

    # ---- everything else -------------------------------------------------
    # A real file (a favicon, the Open Graph card) is served; anything else 404s, and the error
    # page below turns that 404 into the app shell WITHOUT changing the status. robots.txt is NOT
    # among the real files any more — it is the exact-match location above, and a file in public/
    # would be shadowed by it.
    location / {
        try_files $uri =404;
    }

    error_page 404 /worlds/tessera/index.html;

    # nginx's own health, for the container probe. It answers before the app has been fetched, so
    # it says the server is up — never that the app works.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
