<!doctype html>
<!--
  data-cf-product picks the accent ramp and data-cf-substrate the ash ramp, both from
  @cloudsforge/ui/tokens.css. They are on <html> and set STATICALLY rather than by React, because
  a page that paints before the attributes land flashes the default ember and then changes colour.

  `worlds`, because Tessera is a Forge Worlds title and 23-tessera.md §1.1 is explicit: "UI chrome
  wears Forge Worlds' accent #6d9a49, as Emberkin and Aetherholm both do — a title wears its
  product's colour rather than claiming its own."

  `warm`, because this world's ground is fired clay and ember light. Emberkin and Aetherholm chose
  `cool` for a storm-lit sky; Tessera's key light is warm ash-and-ember against cool shadow
  (§1.1), so the substrate leans the other way. It restates no hex — the ramp is the design
  system's.

  data-cf-scheme is the THIRD of the three, and arrives with @cloudsforge/ui 1.1. `auto` follows
  the reader's operating system; `light` and `dark` force one. It is set here, statically, for the
  same reason the other two are — a theme that lands after the first paint is a theme flash.

  This client never carried a light mode of its own, so there is nothing here to delete: `auto` is
  the first time a reader on a light system is served rather than made to fight the page. The
  CANVAS is unaffected either way — the world is drawn from sprites authored against a fixed
  ground, and the scheme changes the chrome around it, not the light in it.
-->
<html lang="en-GB" data-cf-product="worlds" data-cf-substrate="warm" data-cf-scheme="auto">
  <head>
    <meta charset="utf-8" />
    <!--
      Zoom is NOT disabled. A world on a canvas is exactly the surface where somebody reaches for
      pinch-to-zoom, and a viewport lock is an accessibility failure whatever the page contains.
      The canvas has its own zoom control as well; the two do not conflict, because the browser's
      zooms the page and the client's zooms the world.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!--
      `color-scheme`, spelled the way the standard spells it.

      This was `colour-scheme` — correct English, and INERT. It is not a registered meta name, so
      no browser has ever read it, and the declaration meant to tell the browser which form
      controls and scrollbars to draw did nothing at all. The Kiln's prompt box, the land claim's
      ward select and the workshop's price field were drawn in the browser's own scheme on a page
      that had decided otherwise.

      BOTH values, not only `dark`, because `data-cf-scheme="auto"` above means the token layer now
      resolves whichever palette the reader's system asks for. Declaring only `dark` here would
      leave the chrome the browser draws disagreeing with the page around it — which is the same
      defect, in the other direction.
    -->
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Tessera — claim ground for free, fire objects out of a prompt, and get paid in EMBER when someone buys what you made. A persistent isometric world in a browser tab."
    />
    <!--
      The build that produced this bundle. Stamped by the Dockerfile, read by src/lib/obs.ts, and
      the reason an error report can be pinned to the deploy that introduced it. It is an identity
      rather than a configuration: it names the artefact, it does not tell it where it is running.
    -->
    <meta name="cf-release" content="dev" />
    <!--
      THE GOOGLE ANALYTICS MEASUREMENT ID, AND NOT THE GOOGLE ANALYTICS TAG.
      ────────────────────────────────────────────────────────────────────────────────────────
      There is deliberately no third-party analytics `<script src=…>` in this file and there must
      never be one. The tag's own domain is not spelled out here either, so a grep of this file for
      it returns nothing and the absence is CHECKABLE rather than asserted. The stock snippet
      fetches that script and sets `_ga` on load — before any banner has been drawn, let alone
      answered — and under ePrivacy Art. 5(3) an analytics cookie set before consent is a violation
      that a banner underneath it does not cure. `@cloudsforge/ui/consent` injects the tag from
      exactly one place: the Accept button in `CookieBanner`. See that module's header for the
      whole argument.

      It is a meta tag rather than a build-time variable because
      `test/no-build-time-config.test.ts` greps for those — over this file too, which is the other
      reason the prefix is not written out above. Same mechanism as `cf-release` beside it, and the
      same kind of value: an IDENTITY, naming the property, telling the bundle nothing about where
      it is running. An absent or empty value means analytics is simply off, which is what
      `pnpm dev` gets.
    -->
    <meta name="cf-analytics" content="G-NB8DNLTKZQ" />
    <!--
      TESSERA'S OWN CHROME, AND NOBODY ELSE'S.

      This block used to say there was nothing to point at, and it was right at the time: set 14 of
      docs/ecosystem/23-tessera.md §2.14 was still generating in a sibling working tree. It has
      landed. `chrome/mark` (1024×1024, generated) and, derived from it, `favicon-32`,
      `favicon-192`, `favicon-512`, `apple-touch-180` and `og-title`. The five files below are
      BYTE-IDENTICAL copies of those, taken from `micro-tessera-assets/assets/chrome/` and checked
      against that repository's MANIFEST.json sha256 before they were committed.

      The alternative — copying the estate's generic company chrome in so a brand test would go
      green — was refused then and is worth restating now that there is no longer any reason to
      reach for it. Three frontends in this estate shipped images with no favicon while their own
      brand tests passed against a source tree that had one; the failure mode of a PLACEHOLDER is
      that nobody ever notices it is still there.

      APPLE-TOUCH IS THE REAL 180, not an alias of the 192. Every other frontend here points
      `apple-touch-icon` at `/favicon-192x192.png` because 180 was never generated for them. It was
      generated for this title, so pointing at it costs nothing and stops iOS resampling.

      THE OG CARD IS `chrome/og-title`, NOT `keyart/og-1200x630`, and both exist. The keyart card
      is a scene from the world and would draw a better click; the chrome card is the mark trimmed
      to its ink and centred on the flat #12100f ground. Set 14 is what §2.14 calls "title chrome"
      and its manifest note says it was sized at 1200×630 because that is "the size a scraper
      rejects anything else for" — it was built to be this tag. The scene card belongs to whoever
      markets the title, which is not this bundle.

      `test/brand-chrome.test.ts` holds the gate, in BOTH directions: every icon shipped is linked,
      every icon linked is shipped, and every file's sha256 is pinned to what micro-tessera-assets
      recorded — so swapping a placeholder in is a failure rather than a quiet success.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />

    <title>Tessera</title>

    <!-- Relative on purpose: one bundle serves localhost, preview and the apex, and this file
         names no hostname. Crawlers resolve it against the page they fetched. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tessera" />
    <meta
      property="og:description"
      content="A world people make. Claim ground for free, fire an object out of a prompt, open a place. A Forge Worlds title."
    />
    <meta property="og:image" content="/og-1200x630.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
